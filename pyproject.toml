[project]
name = "3-days-in-italy"
version = "0.1.0"
description = "A dataset-grounded three-day Italy trip planner"
readme = "README.md"
authors = [
    { name = "Ian Heraty", email = "heratyian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "ftfy>=6,<7",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langsmith>=0.4,<1",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8,<10",
]

[tool.uv.build-backend]
module-name = "italy_agent"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
