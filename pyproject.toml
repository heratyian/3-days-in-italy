[project]
name = "3-days-in-italy"
version = "0.1.0"
description = "A dataset-grounded three-day Italy trip planner"
readme = "README.md"
authors = [
    { name = "Ian Heraty", email = "heratyian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "ftfy>=6,<7",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "langsmith>=0.4,<1",
    "python-dotenv>=1,<2",
]

[project.scripts]
evals = "evals.conversation:main"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8,<10",
]

[tool.setuptools]
packages = ["italy_agent", "evals"]

[tool.setuptools.package-dir]
italy_agent = "src/italy_agent"
evals = "evals"

[tool.setuptools.package-data]
evals = ["*.json"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
