[project]
name = "3-days-in-italy"
version = "0.1.0"
description = "A dataset-grounded three-day Italy trip planner"
readme = "README.md"
authors = [
    { name = "Ian Heraty", email = "heratyian@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "ftfy>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.build-backend]
module-name = "italy_agent"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
